name: Automated Preprocessing Weekly

on:
  schedule:
    # Berjalan otomatis setiap hari Senin jam 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Membuat tombol agar bisa dijalankan manual kapan saja

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    - name: Run Preprocessing Script
      run: |
        python preprocessing/automate_Dedy_Hendarko.py

    - name: Commit and Push Clean Data
      run: |
        git config --global user.name "Dedy-art"
        git config --global user.email "dedyh861@gmail.com"
        git add preprocessing/namadataset_preprocessing/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated: Update preprocessed data" && git push)
